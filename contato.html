<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BraTech | Contato</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/contato.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <div class="logo">BraTech</div>
        <div class="hamburger"><span></span><span></span><span></span></div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="avatar.html">Avatar</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
                <li><a href="integrantes.html">Equipe</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="form-title">Fale com a BraTech</h1>
        <section class="form-container">
            <form id="formContato" onsubmit="return validarFormulario(event)">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo">
                </div>
                <div class="form-group">
                    <label for="email">E-mail Corporativo:</label>
                    <input type="email" id="email" placeholder="nome@empresa.com">
                </div>
                <div class="form-group">
                    <label for="mensagem">Sua Mensagem:</label>
                    <textarea id="mensagem" placeholder="Como nossa solução pode ajudar sua corporação?"></textarea>
                </div>
                <button type="submit" class="btn-primary">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 BraTech - Challenge SoulUp. Turma 1TDSR.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
